name: release

# Tag a commit to publish a release:
#   git tag v1.3 && git push origin v1.3
# The zip holds exactly what's needed to run the app - no tests, no docs, no CI
# config, no screenshots - so unzipping it and running IntuneDeployment.ps1
# is the whole install.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual build (e.g. v1.3-test)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Optional: a code-signing certificate as repository secrets (the .pfx
      # base64-encoded, and its password). Without them the scripts are
      # released unsigned, as before.
      SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/', '' } else { '${{ inputs.version }}' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Building $version"

      - name: Check the app's own version matches the tag
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.version }}' -replace '^v', '' -replace '-.*$', ''
          $appVersion = (Select-String -Path code/Private/AppState.ps1 -Pattern '\$Global:App\.AppVersion = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $appVersion) {
            throw "The tag says $tag but code/Private/AppState.ps1 says $appVersion - bump `$Global:App.AppVersion first."
          }
          "Version $appVersion"

      - name: Gather the files
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'intune-app-catalog'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item IntuneDeployment.ps1 $staging
          Copy-Item code -Destination (Join-Path $staging 'code') -Recurse
          Remove-Item (Join-Path $staging 'code\tests') -Recurse -Force
          "staging=$staging" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign the scripts
        if: env.SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          # Authenticode signatures with a timestamp, so they stay valid after
          # the certificate expires. Helps with RemoteSigned and endpoint
          # protection; AllSigned still won't run the app, which writes its
          # step helpers at run time.
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:SIGNING_PFX_PASSWORD)
            if (-not $cert.HasPrivateKey) { throw 'The signing certificate has no private key.' }
            $files = Get-ChildItem $env:staging -Recurse -Include *.ps1, *.psm1, *.psd1
            foreach ($f in $files) {
              $sig = Set-AuthenticodeSignature -FilePath $f.FullName -Certificate $cert -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
              if ($sig.Status -in 'NotSigned', 'HashMismatch' -or -not $sig.SignerCertificate) { throw "Signing $($f.Name) failed: $($sig.StatusMessage)" }
            }
            "Signed $($files.Count) script(s) as $($cert.Subject)"
          }
          finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

      - name: Build the zip
        shell: pwsh
        run: |
          $staging = $env:staging
          $zip = Join-Path $env:RUNNER_TEMP "intune-app-catalog-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem $zip | Select-Object Name, Length

      - name: It still starts from the zip
        shell: pwsh
        run: |
          # Unzips into a clean folder and parses every script - catches a
          # file left out of the zip, which a green test run wouldn't.
          $check = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive -Path $env:zip -DestinationPath $check -Force
          $errors = 0
          Get-ChildItem $check -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $errors += $parseErrors.Count; Write-Host "$($_.Name): $($parseErrors[0].Message)" }
          }
          if ($errors -gt 0) { throw "$errors parse error(s) in the zip" }
          foreach ($needed in 'IntuneDeployment.ps1', 'code\Private\Helpers.ps1', 'code\Private\Winget.ps1', 'code\Private\Diagnostics.ps1', 'code\EmbeddedScripts\CreateApp.ps1', 'code\Runner\Invoke-AppStep.ps1', 'code\Web\Start-WebApp.ps1', 'code\Web\WebApi.ps1', 'code\Web\WebEditor.ps1', 'code\Web\WebDeploy.ps1', 'code\Web\WebSettings.ps1', 'code\Web\WebServer.ps1', 'code\Web\WebGraph.ps1', 'code\Web\WebScripts.ps1', 'code\Web\WebGroups.ps1', 'code\Web\WebChecks.ps1', 'code\Web\WebBatch.ps1', 'code\Web\WebBulk.ps1', 'code\Web\WebTenant.ps1', 'code\Web\WebReleases.ps1', 'code\Web\WebAutomation.ps1', 'code\Web\WebSetup.ps1', 'code\Web\ui\index.html', 'code\Web\ui\core.js', 'code\Web\ui\apps.js', 'code\Web\ui\checks.js', 'code\Web\ui\groups.js', 'code\Web\ui\scripts.js', 'code\Web\ui\settings.js', 'code\Web\ui\app.js') {
            if (-not (Test-Path (Join-Path $check $needed))) { throw "$needed is missing from the zip" }
          }
          "The zip parses and has what it needs"
          # And it really starts: the server prints its address, then is stopped again.
          $out = Join-Path $env:RUNNER_TEMP 'start.txt'
          $app = Start-Process pwsh -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$(Join-Path $check 'IntuneDeployment.ps1')`"", '-NoBrowser' -RedirectStandardOutput $out -PassThru -WindowStyle Hidden
          $started = $false
          foreach ($i in 1..60) { Start-Sleep -Seconds 1; if ((Test-Path $out) -and ((Get-Content $out -Raw) -match 'Open:\s+http://127\.0\.0\.1:\d+/')) { $started = $true; break } }
          try { $app.Kill() } catch { }
          if (-not $started) { Get-Content $out -ErrorAction SilentlyContinue; throw "The app from the zip didn't start its server within 60 seconds" }
          "The app from the zip starts"

      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          files: ${{ env.zip }}
          body: |
            See [CHANGELOG.md](https://github.com/monsama/intune-app-catalog/blob/main/CHANGELOG.md) for what changed.

            Download the zip, unblock it if Windows marked it as downloaded, and run `IntuneDeployment.ps1`.
          draft: false
          generate_release_notes: true
