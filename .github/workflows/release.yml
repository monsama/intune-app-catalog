name: release

# Tag a commit to publish a release:
#   git tag v1.3 && git push origin v1.3
# The zip holds exactly what's needed to run the app - no tests, no docs, no CI
# config, no screenshots - so unzipping it and running IntuneDeployment.ps1
# is the whole install.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual build (e.g. v1.3-test)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Optional: a code-signing certificate as repository secrets (the .pfx
      # base64-encoded, and its password). Without them the scripts are
      # released unsigned, as before. Only whether they exist is known to the
      # whole job - the secrets themselves go to the signing step alone, not to
      # the app's start from the zip or the release action.
      HAS_SIGNING: ${{ secrets.CODE_SIGNING_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # The version arrives as data (env), never pasted into the script, and must look like one.
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/', '' } else { $env:INPUT_VERSION }
          if ($version -notmatch '^v\d+\.\d+(\.\d+)?(-[A-Za-z0-9.]+)?$') { throw "Not a version: '$version' (e.g. v2.28.6 or v2.28.6-test)." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Building $version"

      - name: Check the app's own version matches the tag
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.version }}' -replace '^v', '' -replace '-.*$', ''
          $appVersion = (Select-String -Path code/Private/AppState.ps1 -Pattern '\$Global:App\.AppVersion = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $appVersion) {
            throw "The tag says $tag but code/Private/AppState.ps1 says $appVersion - bump `$Global:App.AppVersion first."
          }
          "Version $appVersion"

      - name: Gather the files
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'intune-app-catalog'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item IntuneDeployment.ps1 $staging
          # The license travels with the program (GPL-2.0).
          Copy-Item LICENSE $staging
          Copy-Item code -Destination (Join-Path $staging 'code') -Recurse
          Remove-Item (Join-Path $staging 'code\tests') -Recurse -Force
          "staging=$staging" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign the scripts
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          # Authenticode signatures with a timestamp, so they stay valid after
          # the certificate expires. Helps with RemoteSigned and endpoint
          # protection; AllSigned still won't run the app, which writes its
          # step helpers at run time.
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:SIGNING_PFX_PASSWORD)
            if (-not $cert.HasPrivateKey) { throw 'The signing certificate has no private key.' }
            $files = Get-ChildItem $env:staging -Recurse -Include *.ps1, *.psm1, *.psd1
            foreach ($f in $files) {
              $sig = Set-AuthenticodeSignature -FilePath $f.FullName -Certificate $cert -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
              if ($sig.Status -in 'NotSigned', 'HashMismatch' -or -not $sig.SignerCertificate) { throw "Signing $($f.Name) failed: $($sig.StatusMessage)" }
            }
            "Signed $($files.Count) script(s) as $($cert.Subject)"
          }
          finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

      - name: Build the zip
        shell: pwsh
        run: |
          $staging = $env:staging
          $zip = Join-Path $env:RUNNER_TEMP "intune-app-catalog-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem $zip | Select-Object Name, Length

      - name: It still starts from the zip
        shell: pwsh
        run: |
          # Unzips into a clean folder and parses every script - catches a
          # file left out of the zip, which a green test run wouldn't.
          $check = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive -Path $env:zip -DestinationPath $check -Force
          $errors = 0
          Get-ChildItem $check -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $errors += $parseErrors.Count; Write-Host "$($_.Name): $($parseErrors[0].Message)" }
          }
          if ($errors -gt 0) { throw "$errors parse error(s) in the zip" }
          # Every file the app is made of - what git has outside the tests, so a new file is checked without adding it
          # to a list here (2.38.71: the hand-kept list had missed the clean-up and download scripts).
          $needed = @(git ls-files -- IntuneDeployment.ps1 LICENSE code | Where-Object { $_ -notlike 'code/tests/*' })
          if ($needed.Count -lt 50) { throw "git listed only $($needed.Count) file(s) - expected the whole app" }
          $missing = @($needed | Where-Object { -not (Test-Path -LiteralPath (Join-Path $check ($_ -replace '/', '\'))) })
          if ($missing.Count) { throw "Missing from the zip: $($missing -join ', ')" }
          "The zip parses and has all $($needed.Count) files"
          # And it really starts: the server prints its address, then is stopped again.
          $out = Join-Path $env:RUNNER_TEMP 'start.txt'
          $app = Start-Process pwsh -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$(Join-Path $check 'IntuneDeployment.ps1')`"", '-NoBrowser' -RedirectStandardOutput $out -PassThru -WindowStyle Hidden
          $started = $false
          foreach ($i in 1..60) { Start-Sleep -Seconds 1; if ((Test-Path $out) -and ((Get-Content $out -Raw) -match 'Open:\s+http://127\.0\.0\.1:\d+/')) { $started = $true; break } }
          try { $app.Kill() } catch { }
          if (-not $started) { Get-Content $out -ErrorAction SilentlyContinue; throw "The app from the zip didn't start its server within 60 seconds" }
          "The app from the zip starts"

      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          files: ${{ env.zip }}
          body: |
            See [CHANGELOG.md](https://github.com/monsama/intune-app-catalog/blob/main/CHANGELOG.md) for what changed.

            Download the zip, unblock it if Windows marked it as downloaded, and run `IntuneDeployment.ps1`.
          draft: false
          # A test build ("v2.38.34-test") never becomes the latest release the README links to.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          # The tag goes on the commit that was built, not on the default branch's head.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  image:
    # The server version's image: ghcr.io/monsama/intune-app-catalog:<version> and :latest (deploy-ica.sh pulls it).
    # Only after the release job passed - its version check (tag = AppVersion) guards the image's tag too.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          v="$INPUT_VERSION"
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release version: $v (no image for test builds)"; echo "push=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "push=true" >> "$GITHUB_OUTPUT"
      # The image's layers come from the tests' cache (same Dockerfile, same weekly stamp) - only what changed is built.
      - name: This week
        if: steps.v.outputs.push == 'true'
        id: week
        run: echo "stamp=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.v.outputs.push == 'true'
      - name: Build the image
        if: steps.v.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          build-args: APT_REFRESH=${{ steps.week.outputs.stamp }}
          cache-from: type=gha,scope=ica-image
      - name: Smoke test and publish
        if: steps.v.outputs.push == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          ./scripts/docker-smoke.sh "$img:$VERSION"
          echo "$TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          # A released version's image is never replaced: servers pull it by that tag.
          if docker manifest inspect "$img:$VERSION" >/dev/null 2>&1; then echo "::error::$img:$VERSION exists already - a released image isn't overwritten. Bump the version."; exit 1; fi
          docker push "$img:$VERSION"
          docker push "$img:latest"
