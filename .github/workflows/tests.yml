name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same branch replaces the run that's still going - there's
# no point finishing a run for code that has already moved on.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, PowerShell 7
            os: ubuntu-latest
            shell: pwsh
          - name: Windows, PowerShell 7
            os: windows-latest
            shell: pwsh
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A step's shell can't come from an expression, hence one step per shell.
      - name: CatalogLogic.Tests.ps1 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./code/tests/CatalogLogic.Tests.ps1
      - name: CatalogLogic.Tests.ps1 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./code/tests/CatalogLogic.Tests.ps1
      # Starts the web interface's real server and talks to it over HTTP.
      - name: WebServer.Tests.ps1 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./code/tests/WebServer.Tests.ps1
      - name: WebServer.Tests.ps1 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./code/tests/WebServer.Tests.ps1
      # The pages that read Graph, against stored answers instead of a tenant.
      - name: WebGraph.Tests.ps1 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./code/tests/WebGraph.Tests.ps1
      - name: WebGraph.Tests.ps1 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./code/tests/WebGraph.Tests.ps1


  ui:
    # The web interface in a real browser against the real server: every
    # page in light and dark mode, wide and narrow - no errors, no failed
    # requests, no unnamed buttons, nothing wider than the window, no
    # accessibility rule broken (axe-core), the main dialogs used. The
    # screenshots are kept, to look at what changed.
    name: UI (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: WebUi.Tests.mjs
        run: node code/tests/ui/WebUi.Tests.mjs --shots "$RUNNER_TEMP/ui-shots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore
