name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same branch replaces the run that's still going - there's
# no point finishing a 15-minute GUI audit of code that has already moved on.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, PowerShell 7
            os: ubuntu-latest
            shell: pwsh
          - name: Windows, PowerShell 7
            os: windows-latest
            shell: pwsh
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # A step's shell can't come from an expression, hence one step per shell.
      - name: CatalogLogic.Tests.ps1 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./code/tests/CatalogLogic.Tests.ps1
      - name: CatalogLogic.Tests.ps1 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./code/tests/CatalogLogic.Tests.ps1
      # Reads the dialog sources as text, so it belongs with the unit tests
      # and not the GUI ones - it needs no desktop and runs on Linux too.
      - name: ButtonStyle.Tests.ps1 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./code/tests/ButtonStyle.Tests.ps1
      - name: ButtonStyle.Tests.ps1 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./code/tests/ButtonStyle.Tests.ps1

  gui:
    # Drives the real WinForms app, so it needs the runner's desktop session
    # (hosted runners have one, at 1024x768).
    #
    # One runner per test file and per PowerShell, all at the same time: run
    # end to end on a single runner this is about a quarter of an hour, and
    # the longest single leg (the layout audit under one host) is about five
    # minutes. The unit tests aren't a gate for the same reason - waiting for
    # them would add their queue time to every GUI run.
    name: GUI ${{ matrix.test }} (${{ matrix.host }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        test: [DialogSmoke, CatalogCrud, CloseConfirmation, DialogLayout, GridBehavior, DeployDefaults, ChecksWindow]
        host: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v7
      - name: ${{ matrix.test }}.GuiTests.ps1
        shell: pwsh
        run: >
          ./code/tests/gui/${{ matrix.test }}.GuiTests.ps1
          -AppHost ${{ matrix.host }}
          -ShotDir "$env:RUNNER_TEMP/gui-shots/${{ matrix.test }}"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshots-${{ matrix.test }}-${{ matrix.host }}
          path: ${{ runner.temp }}/gui-shots
          if-no-files-found: ignore
