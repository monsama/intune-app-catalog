name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same branch replaces the run that's still going - there's
# no point finishing a run for code that has already moved on.
# Read-only token: nothing here writes to the repository, and the UI job installs npm packages
# (their install scripts must not get a token that can push).
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, PowerShell 7
            os: ubuntu-latest
            shell: pwsh
          - name: Windows, PowerShell 7
            os: windows-latest
            shell: pwsh
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A step's shell can't come from an expression, hence one step per shell.
      - name: CatalogLogic.Tests.ps1 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./code/tests/CatalogLogic.Tests.ps1
      - name: CatalogLogic.Tests.ps1 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./code/tests/CatalogLogic.Tests.ps1
      # Starts the web interface's real server and talks to it over HTTP.
      - name: WebServer.Tests.ps1 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./code/tests/WebServer.Tests.ps1
      - name: WebServer.Tests.ps1 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./code/tests/WebServer.Tests.ps1
      # The pages that read Graph, against stored answers instead of a tenant.
      - name: WebGraph.Tests.ps1 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./code/tests/WebGraph.Tests.ps1
      - name: WebGraph.Tests.ps1 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./code/tests/WebGraph.Tests.ps1
      # 500 generated apps: the requests that read the whole catalog, timed.
      - name: Scale.Tests.ps1 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./code/tests/Scale.Tests.ps1
      - name: Scale.Tests.ps1 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./code/tests/Scale.Tests.ps1


  docker:
    # The server version: the image builds, starts (read-only, no rights), signs in, takes a session over,
    # refuses other names, and reads winget's package index.
    name: docker (server version)
    runs-on: ubuntu-latest
    # A normal run takes a few minutes - a stalled package mirror fails the job instead of holding it for an hour.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image's layers are cached between runs, so the slow part (Ubuntu's packages) is only downloaded again
      # when the Dockerfile changes or a new week starts (APT_REFRESH - the security fixes still come in weekly).
      - name: This week
        id: week
        run: echo "stamp=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: intune-app-catalog:smoke
          build-args: APT_REFRESH=${{ steps.week.outputs.stamp }}
          cache-from: type=gha,scope=ica-image
          cache-to: type=gha,scope=ica-image,mode=max
      - name: Smoke test
        run: ./scripts/docker-smoke.sh intune-app-catalog:smoke

  lint:
    # PSScriptAnalyzer with the bug-catching rules in
    # code/tests/PSScriptAnalyzerSettings.psd1 - over all of code/, not only
    # what the tests happen to run.
    name: lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
      - name: Analyze code/
        shell: pwsh
        run: |
          $found = @(Invoke-ScriptAnalyzer -Path code -Recurse -Settings code/tests/PSScriptAnalyzerSettings.psd1)
          $found | Sort-Object ScriptName, Line | ForEach-Object { "{0}:{1} [{2}] {3}" -f ($_.ScriptPath -replace [regex]::Escape("$PWD/"), ''), $_.Line, $_.RuleName, $_.Message }
          "$($found.Count) finding(s)"
          if ($found.Count) { exit 1 }

  ui:
    # The web interface in a real browser against the real server: every
    # page in light and dark mode, wide and narrow - no errors, no failed
    # requests, no unnamed buttons, nothing wider than the window, no
    # accessibility rule broken (axe-core), the main dialogs used. The
    # screenshots are kept, to look at what changed.
    name: UI (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: WebUi.Tests.mjs
        run: node code/tests/ui/WebUi.Tests.mjs --shots "$RUNNER_TEMP/ui-shots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore
