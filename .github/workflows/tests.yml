name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, PowerShell 7
            os: ubuntu-latest
            shell: pwsh
          - name: Windows, PowerShell 7
            os: windows-latest
            shell: pwsh
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # A step's shell can't come from an expression, hence one step per shell.
      - name: CatalogLogic.Tests.ps1 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./code/tests/CatalogLogic.Tests.ps1
      - name: CatalogLogic.Tests.ps1 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./code/tests/CatalogLogic.Tests.ps1

  gui:
    # Drives the real WinForms app, so it needs the runner's desktop session
    # (hosted runners have one, at 1024x768).
    name: GUI (Windows, both PowerShells)
    runs-on: windows-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: DialogSmoke.GuiTests.ps1
        shell: pwsh
        run: ./code/tests/gui/DialogSmoke.GuiTests.ps1 -ShotDir "$env:RUNNER_TEMP/gui-shots/smoke"
      - name: CatalogCrud.GuiTests.ps1
        if: always()
        shell: pwsh
        run: ./code/tests/gui/CatalogCrud.GuiTests.ps1 -ShotDir "$env:RUNNER_TEMP/gui-shots/crud"
      - name: CloseConfirmation.GuiTests.ps1
        if: always()
        shell: pwsh
        run: ./code/tests/gui/CloseConfirmation.GuiTests.ps1
      - name: DialogLayout.GuiTests.ps1
        if: always()
        shell: pwsh
        run: ./code/tests/gui/DialogLayout.GuiTests.ps1 -ShotDir "$env:RUNNER_TEMP/gui-shots/layout"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: ${{ runner.temp }}/gui-shots
          if-no-files-found: ignore
